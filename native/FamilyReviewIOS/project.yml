name: FamilyReview
options:
  bundleIdPrefix: local.familyreview
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.3.0'
    CURRENT_PROJECT_VERSION: '20'
packages:
  PaymentImageCore:
    path: ../PaymentImageCore
targets:
  FamilyReview:
    type: application
    platform: iOS
    sources:
      - path: FamilyReviewApp
        excludes: [Info.plist]
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/App.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/FinancialView.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/TransactionFactsView.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/SourceRecordSetView.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/ReviewConflictView.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/FinancialEditing.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/WorkspaceEditing.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/HouseholdSettingsView.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/CompletionView.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/CategoryManagementView.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/ReviewLatency.swift
      - path: ../PaymentImageCore/Sources/EvidenceBrowser/AdaptiveReview.swift
      - path: Bootstrap
        type: folder
        buildPhase: resources
    info:
      path: FamilyReviewApp/Info.plist
      properties:
        CFBundleDisplayName: 家庭财务复盘
        CFBundleShortVersionString: '1.3.0'
        CFBundleVersion: '20'
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: PaymentImageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.familyreview.FamilyReview
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FamilyReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FamilyReviewUITests]
    dependencies:
      - target: FamilyReview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FamilyReview:
    build:
      targets:
        FamilyReview: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [FamilyReviewUITests]
